services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: portfolio-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - portfolio-prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - frontend

  grafana:
    image: grafana/grafana:11.3.0
    container_name: portfolio-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-this-password}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./monitoring/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - portfolio-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - frontend

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.1
    container_name: portfolio-nginx-exporter
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - frontend

  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    container_name: portfolio-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped
    networks:
      - frontend

volumes:
  portfolio-prometheus-data:
  portfolio-grafana-data: